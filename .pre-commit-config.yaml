repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--config", "config/linting/.flake8"]

  - repo: local
    hooks:
      - id: python-check
        name: py_compile
        entry: python -m compileall src
        language: system
        pass_filenames: false
