[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = """
(
  ^\\.venv/
| ^node_modules/
| ^_tmp_branch/
| ^archive/
| ^logs/
)
"""

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "node_modules", "_tmp_branch", "archive", "logs"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
miniversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pypackages__"]
extend-exclude = ["node_modules", "_tmp_branch", "archive", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "B", "I", "Q"]
ignore = ["E501", "F403", "N802", "N803", "N806", "B006", "B009", "I001", "Q000"]