name: Lint

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install
      - name: Check style
        run: |
          # Black reads settings from pyproject.toml (line-length=120)
          black --check .
          # Ensure isort aligns with Black and project settings
          isort --check-only --settings-path config/.isort.cfg .
          # Use centralized flake8 config (max-line-length > 79)
          flake8 --config config/.flake8 .
          python -m py_compile app.py app_components/*.py
      - name: Lint CSS
        run: npm run lint:css
